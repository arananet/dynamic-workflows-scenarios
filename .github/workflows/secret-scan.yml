# Secret scanning with gitleaks.
# Docs: https://github.com/gitleaks/gitleaks-action
#
# Runs on every push and PR. Fails the build if any leak is detected.
# A .gitleaks.toml at the repo root is optional — gitleaks uses sensible
# defaults out of the box.
name: Secret Scan

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED for this repository.
#
# dynamic-workflows-scenarios ships workflow scripts and OpenSpec specs — no
# built artifacts, no container images, no published packages, no dependency
# tree. The automatic triggers below were removed so this workflow no longer
# runs on push/PR/schedule; it is retained as manual-dispatch only.
#
# To re-enable: delete the `on: workflow_dispatch` block and uncomment the
# original trigger block that follows it.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

# ── Original triggers (disabled):
# on:
#   push:
#     branches: [main]
#   pull_request:
#   workflow_dispatch:
#
permissions: read-all

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for full-history scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — set GITLEAKS_LICENSE for organisational use.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
