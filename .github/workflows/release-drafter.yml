# Keep a draft release up to date with every merged PR on the default branch.
# On release creation, the draft becomes the published release notes.
name: Release Drafter

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED for this repository.
#
# dynamic-workflows-scenarios ships workflow scripts and OpenSpec specs — no
# built artifacts, no container images, no published packages, no dependency
# tree. The automatic triggers below were removed so this workflow no longer
# runs on push/PR/schedule; it is retained as manual-dispatch only.
#
# To re-enable: delete the `on: workflow_dispatch` block and uncomment the
# original trigger block that follows it.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

# ── Original triggers (disabled):
# on:
#   push:
#     branches: [main]
#   pull_request:
#     types: [opened, reopened, synchronize, labeled, unlabeled]
#   workflow_dispatch:
#
permissions: read-all

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Update draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@3f0f87098bd6b5c5b9a36d49c41d998ea58f9348 # v6.0.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
