# CodeQL — GitHub's native static-analysis engine.
# Docs: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning
#
# Runs on every push to main, every PR, and weekly to catch newly-disclosed
# query regressions even when the code isn't changing. Languages are
# auto-detected via a small inline matrix — delete rows your repo doesn't use.
name: CodeQL

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED for this repository.
#
# dynamic-workflows-scenarios ships workflow scripts and OpenSpec specs — no
# built artifacts, no container images, no published packages, no dependency
# tree. The automatic triggers below were removed so this workflow no longer
# runs on push/PR/schedule; it is retained as manual-dispatch only.
#
# To re-enable: delete the `on: workflow_dispatch` block and uncomment the
# original trigger block that follows it.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

# ── Original triggers (disabled):
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#   schedule:
#     # Every Monday at 03:17 UTC — off-peak, avoids the top-of-hour stampede.
#     - cron: "17 3 * * 1"
#   workflow_dispatch:
#
permissions: read-all

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Delete languages that don't apply. CodeQL-supported languages:
        # cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift
        language:
          - javascript-typescript
          - python
          - go

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
