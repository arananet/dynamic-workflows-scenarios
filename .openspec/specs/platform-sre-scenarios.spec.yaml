technical_notes: |
  The independent re-estimation pass in `cloud-cost-hotspots` exists for a
  political reason as much as a technical one. FinOps programmes lose
  credibility on the first inflated saving claim, and an LLM asked to estimate
  a saving will happily produce a confident number. Having a second agent
  re-derive it from the same evidence, and reporting only confirmed and
  adjusted figures in the headline, makes the total something an engineering
  leader can repeat in a finance meeting.

  Both workflows sort their backlog by blast radius rather than by raw
  severity, because a medium gap on a payment path outranks a high gap on an
  internal admin tool, and every readiness report that ignores this gets
  ignored in turn.

