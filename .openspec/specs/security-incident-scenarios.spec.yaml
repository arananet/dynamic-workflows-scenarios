technical_notes: |
  Both workflows spend most of their agent budget on verification rather than
  discovery, which is the inversion that makes them useful. Discovery
  ("is the package here", "what changed on Tuesday") is cheap and a scanner or
  a git log already does it. Judgement ("is it reachable", "did this cause
  that") is what a human currently does serially, and it is what parallel
  agents with an adversarial second pass do well.

  `incident-forensics` primes each cross-examiner with a *rival* hypothesis
  rather than asking it to critique neutrally. A neutral critique of a
  plausible story tends to agree with it; an examiner with a stake in a
  different story finds the holes.

