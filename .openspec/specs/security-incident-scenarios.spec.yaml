description: |
  When a critical advisory drops on a Friday, the expensive question is not
  "do we have this package" — a scanner answers that in seconds and returns
  300 services. The expensive question is "in how many of those 300 is the
  vulnerable code path actually reachable from untrusted input", and that
  question currently costs a security team a weekend. The same shape appears
  during an incident: the data needed to explain what happened is spread
  across commits, deploys, migrations and flag flips, and one responder can
  only hold a fraction of it while the clock runs.

  This feature ships two workflows for those two moments.

  `cve-blast-radius` starts from an advisory, discovers where the affected
  component is present, and then spends its agent budget on the part that
  matters: one reachability analyst per candidate, asking whether the
  vulnerable API is called at all, and whether anything attacker-controlled
  can reach it. Every "reachable" verdict is then re-argued by an independent
  agent whose job is to knock it down, because a false "reachable" costs a
  needless emergency deploy and a false "not reachable" is a breach. The
  output is a triaged remediation plan ordered by real exposure, with owners.

  `incident-forensics` reconstructs an incident window from the artefacts a
  repository actually holds — commits, merges, deploy-shaped changes, config
  and migration edits — then does something a single responder cannot: it
  generates several competing causal hypotheses in parallel, has each one
  cross-examined by an agent arguing for a different hypothesis, and ranks
  them by surviving evidence. It returns a post-mortem draft with an
  evidence-linked timeline, the leading cause, the rejected alternatives and
  why they were rejected, and the contributing factors worth fixing.

acceptance_criteria:
  - "Given an advisory in `args.advisory`, when `cve-blast-radius` runs, then a scoping agent first resolves the affected component and vulnerable symbols, and that resolution appears in the result."
  - "Given resolved candidates, when the reachability phase runs, then one analyst agent is spawned per candidate, capped by `args.maxCandidates` (default 100), and each analyst prompt names its candidate and the vulnerable symbols to look for."
  - "Given an analyst verdict of `reachable`, when the challenge phase runs, then an independent agent is asked to refute that verdict and returns `confirmed`, `refuted` or `unverified`."
  - "Given the challenge results, when the remediation plan is assembled, then candidates are ordered by exposure, refuted verdicts are downgraded rather than dropped, and unverified verdicts are listed separately so they are never reported as safe."
  - "Given a completed run, when the result is returned, then every remediation entry carries a candidate, a verdict, a priority and a suggested action."
  - "Given an incident window in `args.window` and symptoms in `args.symptoms`, when `incident-forensics` runs, then a timeline phase collects change artefacts for that window before any hypothesis is generated."
  - "Given a reconstructed timeline, when the hypothesis phase runs, then at least three competing hypotheses are generated by separate agents, and each agent's prompt directs it at a different class of cause."
  - "Given the hypotheses, when the cross-examination phase runs, then each hypothesis is examined by an agent primed with a rival hypothesis, and each hypothesis receives the same number of examinations."
  - "Given cross-examined hypotheses, when the post-mortem is emitted, then it names a leading cause, lists the rejected hypotheses with the evidence that sank them, and returns contributing factors as actionable items."
  - "Given an empty scope — no candidates for the advisory, or no artefacts in the incident window — when either workflow runs, then it returns a well-formed empty-scope result instead of throwing."

test_plan:
  - "Integration: `cve-blast-radius` calls a scoping agent before any reachability agent, and the result exposes the resolved component and symbols."
  - "Unit: a scoping stub returning 250 candidates caps reachability agents at the default 100; `args.maxCandidates: 10` caps them at 10."
  - "Unit: reachability agents are spawned only for candidates, and each prompt contains its candidate identifier."
  - "Unit: with a stub forcing every reachability verdict to `reachable`, one challenge agent is spawned per reachable candidate."
  - "Unit: with a stub forcing every challenge verdict to `refuted`, no candidate is reported at top priority and every refuted candidate is still present in the result with its refutation."
  - "Unit: with a stub forcing every challenge verdict to `unverified`, those candidates appear under `unverified` and not under `safe`."
  - "Unit: every remediation entry has non-empty `candidate`, `verdict`, `priority` and `action` fields."
  - "Integration: `incident-forensics` runs its timeline phase before its hypothesis phase, and generates at least three hypotheses from three distinct cause-class prompts."
  - "Unit: each hypothesis receives an equal number of cross-examination agents, and no examiner is primed with the hypothesis it examines."
  - "Unit: the emitted post-mortem has a non-empty `leadingCause`, a `rejected` list whose entries each carry a reason, and a non-empty `contributingFactors` list."
  - "Integration: both workflows return an empty-scope result, without throwing, when their scoping phase yields nothing."

qa_notes: |
  For `cve-blast-radius`, deliberately point it at a service where the
  vulnerable package is present but demonstrably unused, and confirm the
  challenge phase downgrades it. The workflow earns its cost by *removing*
  services from the emergency list, not by adding them.

  For `incident-forensics`, the run is only as good as the artefacts in the
  repository. If deploys and flag flips live in a system the agents cannot
  read, the timeline will be commit-shaped and the post-mortem will over-weight
  code changes. Say so in the run, and treat the draft as a starting point for
  the review, never as the review.

out_of_scope:
  - "Applying patches or opening remediation PRs — both workflows report, a human decides."
  - "Reading external telemetry (APM, log aggregators, cloud audit logs). Both workflows work from repository artefacts and whatever tools the session already allows."
  - "Deciding incident severity or driving comms — `incident-forensics` drafts the post-mortem, it does not run the incident."
  - "Maintaining a CVE database. The advisory content is supplied via `args`."

