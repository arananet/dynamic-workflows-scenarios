technical_notes: |
  `strangler-fig-plan` uses the documentation's "draft a plan from several
  independent angles and weigh them against each other" pattern rather than
  the audit fan-out pattern. Its agent count is small and fixed (3 drafts,
  3 x N critiques, 1 scorer, 1 roadmap) so it is cheap to run repeatedly while
  an architecture decision is being argued.

  `ma-code-diligence` deliberately keeps lenses independent — no lens sees
  another lens's findings — so the reconciliation agent is combining genuinely
  independent opinions. Letting lenses read each other would be cheaper and
  strictly worse: correlated findings look like corroboration.

