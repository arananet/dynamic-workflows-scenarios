technical_notes: |
  Workflow scripts are not valid ES modules: they combine `export const meta`
  with a top-level `return`. The harness therefore loads a script by reading
  its source, rewriting the single token `export const meta =` to
  `const meta = __ctx.meta =`, and compiling the result with the
  `AsyncFunction` constructor with `__ctx`, `agent`, `pipeline` and `args` as
  parameters. This preserves top-level `await` and top-level `return`, keeps
  the on-disk script byte-identical to what Claude Code saved, and needs no
  transpiler or dependency.

  Node's built-in test runner (`node --test`) is used so the repository stays
  dependency-free — there is no package manager step in CI.

