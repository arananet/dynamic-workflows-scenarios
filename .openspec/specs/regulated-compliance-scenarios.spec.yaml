technical_notes: |
  The investigate → challenge → synthesise shape is the repository's default
  quality pattern, taken from the dynamic workflows documentation: independent
  agents adversarially review each other's findings before anything is
  reported. It costs roughly 2x the agents of a naive sweep and is worth it
  here, because the entire business value of an evidence pack is that a third
  party can trust it.

  `reg-change-impact` caps its fan-out with `args.maxAssessments` rather than
  assessing the full cross-product of obligations and services: a 15-obligation
  delta against a 400-service estate is 6000 pairs, well past the runtime's
  1000-agent cap. The scoping phase ranks candidate pairs so the cap truncates
  the tail, not the head.

